<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка разборов</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #e3e6ea;
    --ink: #1a1d21;
    --muted: #6b7280;
    --accent: #2563eb;
    --warn-bg: #fff7e6;
    --warn-line: #f0c36d;
    --bad: #c2410c;
    --ok: #15803d;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, Inter, system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap;
    padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .stats { display: flex; gap: 20px; margin-left: auto; color: var(--muted); font-size: 13px; }
  .stats b { font-family: var(--mono); color: var(--ink); font-weight: 600; }

  main { display: grid; grid-template-columns: 300px 1fr; gap: 1px; background: var(--line); min-height: calc(100vh - 53px); }
  .queue, .detail { background: var(--bg); }
  .queue { overflow-y: auto; max-height: calc(100vh - 53px); }

  .filters { display: flex; gap: 6px; padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  .filters button {
    flex: 1; padding: 5px 8px; font: inherit; font-size: 12px; cursor: pointer;
    background: transparent; border: 1px solid var(--line); border-radius: 5px; color: var(--muted);
  }
  .filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

  .card {
    padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; background: var(--panel);
  }
  .card:hover { background: #fbfcfd; }
  .card[aria-current="true"] { box-shadow: inset 3px 0 0 var(--accent); background: #f5f8ff; }
  .card .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card .id { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .card .who { font-weight: 600; font-size: 13px; }
  .card .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .conf { font-family: var(--mono); font-size: 12px; }
  .conf.low { color: var(--bad); font-weight: 600; }
  .status { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--line); color: var(--muted); }
  .status.approved, .status.corrected { color: var(--ok); border-color: #bbe5c8; }
  .status.rejected { color: var(--bad); border-color: #f0c0a8; }

  .detail { padding: 18px 22px 60px; overflow-y: auto; max-height: calc(100vh - 53px); }
  .empty { color: var(--muted); padding: 40px 0; }
  .split { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(380px, 1.3fr); gap: 20px; align-items: start; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; }
  .panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  pre.source { white-space: pre-wrap; font: 13px/1.6 var(--mono); margin: 0; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--muted); font-weight: 600; padding: 0 6px 6px; text-transform: uppercase; letter-spacing: .04em; }
  td { padding: 6px; border-top: 1px solid var(--line); vertical-align: top; }
  tr.attention td { background: var(--warn-bg); }
  input[type="text"], input[type="number"] {
    width: 100%; padding: 5px 7px; font: inherit; border: 1px solid var(--line); border-radius: 5px; background: #fff;
  }
  input.uncertain { border-color: var(--warn-line); background: #fffdf6; }
  input.edited { border-color: var(--accent); background: #f5f8ff; }
  .cell { position: relative; }
  .score { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 3px; display: block; }
  .score.low { color: var(--bad); }
  .flags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .flag { font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--warn-bg); border: 1px solid var(--warn-line); color: #92400e; }

  .actions { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  button.primary, button.ghost {
    padding: 8px 16px; font: inherit; border-radius: 6px; cursor: pointer; border: 1px solid transparent;
  }
  button.primary { background: var(--accent); color: #fff; }
  button.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { color: var(--muted); font-size: 12px; }
  .done { padding: 10px 12px; border-radius: 6px; background: #f0fdf4; border: 1px solid #bbe5c8; color: #14532d; margin-bottom: 14px; }
  .done.rejected { background: #fff4ed; border-color: #f0c0a8; color: #7c2d12; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .queue { max-height: 240px; }
    .split { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Проверка разборов</h1>
  <div class="stats" id="stats"></div>
</header>

<main>
  <aside class="queue">
    <div class="filters">
      <button data-filter="attention" aria-pressed="true">Требуют внимания</button>
      <button data-filter="pending" aria-pressed="false">Все новые</button>
      <button data-filter="all" aria-pressed="false">Все</button>
    </div>
    <div id="list"></div>
  </aside>

  <section class="detail" id="detail">
    <p class="empty">Выберите разбор слева.</p>
  </section>
</main>

<script>
const state = { filter: "attention", current: null, task: null };

const api = async (url, options) => {
  const res = await fetch(url, options);
  if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.statusText);
  return res.json();
};

const FLAG_LABEL = {
  low_confidence: "низкая уверенность",
  not_in_catalog: "нет в справочнике",
  ambiguous_unit: "единица неоднозначна",
  duplicate: "повтор позиции",
};
const STATUS_LABEL = { pending: "ждёт", approved: "принято", corrected: "исправлено", rejected: "отклонено" };

function renderStats(counts, stats) {
  document.getElementById("stats").innerHTML = `
    <span>в очереди <b>${counts.pending}</b></span>
    <span>из них с пометками <b>${counts.attention}</b></span>
    <span>проверено <b>${stats.reviewed}</b></span>
    <span>правили руками <b>${(stats.correction_rate * 100).toFixed(0)}%</b></span>
    <span>ошибок в полях <b>${(stats.field_error_rate * 100).toFixed(1)}%</b></span>`;
}

async function loadQueue() {
  const params = state.filter === "attention" ? "?status=pending&attention=true"
               : state.filter === "pending" ? "?status=pending" : "";
  const data = await api("/api/tasks" + params);
  renderStats(data.counts, data.stats);

  const list = document.getElementById("list");
  if (!data.tasks.length) {
    list.innerHTML = `<p class="empty" style="padding:16px">Пусто. Всё проверено.</p>`;
    return;
  }
  list.innerHTML = data.tasks.map(t => `
    <article class="card" data-id="${t.id}" aria-current="${t.id === state.current}">
      <div class="row">
        <span class="who">${t.customer}</span>
        <span class="conf ${t.needs_attention ? "low" : ""}">${t.min_confidence.toFixed(2)}</span>
      </div>
      <div class="row">
        <span class="id">${t.id} · ${t.items} поз.</span>
        <span class="status ${t.status}">${STATUS_LABEL[t.status]}</span>
      </div>
      <div class="meta">${t.received_at}</div>
      ${t.flags.length ? `<div class="flags">${t.flags.map(f => `<span class="flag">${FLAG_LABEL[f] || f}</span>`).join("")}</div>` : ""}
    </article>`).join("");

  list.querySelectorAll(".card").forEach(el => el.onclick = () => openTask(el.dataset.id));
}

function fieldCell(item, index, name, type) {
  const f = item[name];
  const cls = [f.edited ? "edited" : "", f.uncertain ? "uncertain" : ""].join(" ").trim();
  const value = f.final ?? "";
  const score = `<span class="score ${f.uncertain ? "low" : ""}">${f.confidence.toFixed(2)}</span>`;
  const disabled = state.task.status !== "pending" ? "disabled" : "";
  return `<td class="cell">
    <input type="${type}" value="${String(value).replace(/"/g, "&quot;")}"
           data-item="${index}" data-field="${name}" class="${cls}" ${disabled}>
    ${score}
  </td>`;
}

async function openTask(id) {
  state.current = id;
  state.task = await api(`/api/tasks/${id}`);
  const t = state.task;
  const reviewed = t.status !== "pending";

  document.getElementById("detail").innerHTML = `
    ${reviewed ? `<div class="done ${t.status === "rejected" ? "rejected" : ""}">
        ${STATUS_LABEL[t.status]} · ${t.reviewed_by || ""} · ${t.reviewed_at || ""}
        ${t.note ? `<br>${t.note}` : ""}
      </div>` : ""}
    <div class="split">
      <div class="panel">
        <h2>Письмо · ${t.customer}</h2>
        <pre class="source">${t.source.replace(/</g, "&lt;")}</pre>
      </div>
      <div class="panel">
        <h2>Что извлекла модель · ${t.model}</h2>
        <table>
          <thead><tr><th style="width:52%">Позиция</th><th style="width:20%">Кол-во</th><th style="width:28%">Ед.</th></tr></thead>
          <tbody>
            ${t.items.map((item, i) => `
              <tr class="${item.needs_attention ? "attention" : ""}">
                ${fieldCell(item, i, "name", "text")}
                ${fieldCell(item, i, "qty", "number")}
                ${fieldCell(item, i, "unit", "text")}
              </tr>
              ${item.flags.length ? `<tr class="${item.needs_attention ? "attention" : ""}">
                 <td colspan="3" style="border-top:none;padding-top:0">
                   <div class="flags">${item.flags.map(f => `<span class="flag">${FLAG_LABEL[f] || f}</span>`).join("")}</div>
                 </td></tr>` : ""}`).join("")}
          </tbody>
        </table>
        ${reviewed ? "" : `
        <div class="actions">
          <button class="primary" id="approve">Принять</button>
          <button class="ghost" id="reject">Отклонить</button>
          <span class="hint">Правьте поля прямо в таблице — правка сохранится вместе с решением.</span>
        </div>`}
      </div>
    </div>`;

  if (reviewed) return;
  document.querySelectorAll("#detail input").forEach(input => {
    input.oninput = () => input.classList.add("edited");
  });
  document.getElementById("approve").onclick = () => decide("approve");
  document.getElementById("reject").onclick = () => {
    const note = prompt("Что не так с этим разбором?");
    if (note && note.trim()) decide("reject", note.trim());
  };
}

function collectEdits() {
  const edits = [];
  document.querySelectorAll("#detail input.edited").forEach(input => {
    const i = Number(input.dataset.item), field = input.dataset.field;
    const original = state.task.items[i][field];
    let value = input.value;
    if (field === "qty") value = Number(value);
    if (String(original.final) !== String(value)) edits.push({ item: i, field, value });
  });
  return edits;
}

async function decide(action, note = "") {
  const body = { action, note, operator: "оператор", edits: action === "approve" ? collectEdits() : [] };
  try {
    await api(`/api/tasks/${state.current}/decision`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
  } catch (e) {
    alert("Не удалось сохранить: " + e.message);
    return;
  }
  await loadQueue();
  await openTask(state.current);
}

document.querySelectorAll(".filters button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".filters button").forEach(b => b.setAttribute("aria-pressed", String(b === btn)));
    state.filter = btn.dataset.filter;
    loadQueue();
  };
});

loadQueue();
</script>
</body>
</html>
